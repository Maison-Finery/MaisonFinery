<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maison Finery</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fffaf7;
      color: #333;
    }

    header {
      text-align: center;
      padding: 25px 15px;
      background: white;
      border-bottom: 1px solid #eee;
    }

    header h1 {
      margin: 0;
      font-family: Georgia, serif;
      font-size: 32px;
    }

    header p {
      margin: 8px 0 0;
      color: #777;
    }

    .search {
      padding: 20px;
      text-align: center;
    }

    .search input {
      width: 85%;
      max-width: 400px;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 25px;
      font-size: 15px;
    }

    .hero {
      text-align: center;
      padding: 45px 20px;
    }

    .hero h2 {
      font-family: Georgia, serif;
      font-size: 30px;
    }

    .hero p {
      color: #666;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 20px;
      padding: 20px;
      max-width: 900px;
      margin: auto;
    }

    .product {
      background: white;
      border-radius: 15px;
      padding: 15px;
      text-align: center;
      box-shadow: 0 3px 12px rgba(0,0,0,0.06);
    }

    .product .photo {
      height: 180px;
      background: #f2e8e3;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #999;
    }

    .product h3 {
      margin-bottom: 5px;
    }

    .price {
      font-weight: bold;
      margin: 10px;
    }

    button {
      border: none;
      background: #333;
      color: white;
      padding: 10px 18px;
      border-radius: 20px;
      cursor: pointer;
    }

    footer {
      text-align: center;
      padding: 30px;
      margin-top: 30px;
      background: white;
      color: #777;
    }
  </style>
</head>

<body>

<header>
  <h1>Maison Finery</h1>
  <p>Élégance au quotidien ✨</p>
</header>

<div class="search">
  <input type="text" placeholder="Rechercher un produit...">
</div>

<section class="hero">
  <h2>Bienvenue chez Maison Finery</h2>
  <p>Découvrez notre sélection d'accessoires tendance.</p>
</section>

<section class="products">

  <div class="product">
    <div class="photo">Photo du produit</div>
    <h3>Bijou élégant</h3>
    <div class="price">12,99 €</div>
    <button>Ajouter au panier</button>
  </div>

  <div class="product">
    <div class="photo">Photo du produit</div>
    <h3>Bracelet Finery</h3>
    <div class="price">9,99 €</div>
    <button>Ajouter au panier</button>
  </div>

  <div class="product">
    <div class="photo">Photo du produit</div>
    <h3>Collier Maison</h3>
    <div class="price">14,99 €</div>
    <button>Ajouter au panier</button>
  </div>

</section>

<footer>
  © 2026 Maison Finery — Tous droits réservés
</footer>

</body>
</html>
